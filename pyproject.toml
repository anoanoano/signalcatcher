[project]
name = "signalcatcher"
version = "0.1.0"
description = "A benchmark for the originality and influence of information sources."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.40",
    "python-dateutil>=2.9",
    "selectolax>=0.3.21",
    "tenacity>=8.5",
]

[project.scripts]
signalcatcher = "signalcatcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signalcatcher"]
